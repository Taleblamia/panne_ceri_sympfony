services:
  app:
    build:
      context: ..
      dockerfile: backend-symfony/Dockerfile
    container_name: ticket-panne-ceri
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./database.db:/app/backend-symfony/database.db
      - ./public/uploads:/app/backend-symfony/public/uploads
